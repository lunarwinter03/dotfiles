<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- GENERIERT von matugen – nicht von Hand bearbeiten!
     Quelle: ~/.config/matugen/templates/fontconfig.conf
     Werte:  ~/.config/matugen/fonts.json -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>{{fonts.family.sans}}</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>{{fonts.family.serif}}</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>{{fonts.family.mono}}</family></prefer>
  </alias>
</fontconfig>
