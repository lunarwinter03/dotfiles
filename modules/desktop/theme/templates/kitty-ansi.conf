# GENERIERT von matugen – nicht von Hand bearbeiten!
# Quelle: ~/dotfiles/theme/templates/kitty-ansi.conf
# Überschreibt die feste Palette aus ansi.conf

# ===== Graustufen aus dem Theme =====
color0  {{colors.surface_container_high.default.hex}}
color8  {{colors.outline.default.hex}}
color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}

# ===== Farben: kräftige Vorgabe, Farbton anteilig Richtung Theme =====
# Regler in ~/dotfiles/theme/ansi.json, einstellen mit: ansi-tune

# Rot
color1  {{ colors.red_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_semantic }} * 1.0 }}
color9  {{ colors.red_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_semantic }} * 1.0 | lighten: {{ ansi.lighten }} * 1.0 }}

# Grün
color2  {{ colors.green_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_semantic }} * 1.0 }}
color10 {{ colors.green_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_semantic }} * 1.0 | lighten: {{ ansi.lighten }} * 1.0 }}

# Gelb
color3  {{ colors.yellow_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 }}
color11 {{ colors.yellow_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 | lighten: {{ ansi.lighten }} * 1.0 }}

# Blau
color4  {{ colors.blue_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 }}
color12 {{ colors.blue_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 | lighten: {{ ansi.lighten }} * 1.0 }}

# Magenta
color5  {{ colors.magenta_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 }}
color13 {{ colors.magenta_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 | lighten: {{ ansi.lighten }} * 1.0 }}

# Cyan
color6  {{ colors.cyan_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 }}
color14 {{ colors.cyan_source.default.hex | blend: {{ colors.source_color.default.hex }}, {{ ansi.blend_other }} * 1.0 | lighten: {{ ansi.lighten }} * 1.0 }}

