# GENERIERT von matugen – nicht von Hand bearbeiten!
# Quelle: ~/.config/matugen/templates/mango-colors.conf

# --- Fensterrahmen ---
focus_color=0x{{colors.primary.default.hex_stripped}}ff
border_color=0x{{colors.outline_variant.default.hex_stripped}}ff
urgent_color=0x{{colors.error.default.hex_stripped}}ff

# --- Fensterzustände ---
maximized_screen_color=0x{{colors.secondary.default.hex_stripped}}ff
overlay_color=0x{{colors.secondary.default.hex_stripped}}ff
scratchpad_color=0x{{colors.tertiary.default.hex_stripped}}ff
global_color=0x{{colors.tertiary.default.hex_stripped}}ff

# --- dwindle / Drag & Drop ---
split_color=0x{{colors.tertiary.default.hex_stripped}}ff
drop_color=0x{{colors.primary.default.hex_stripped}}55

# --- Hintergrund, Schatten, Abdunkeln ---
root_color=0x{{colors.surface.default.hex_stripped}}ff
shadows_color=0x{{colors.shadow.default.hex_stripped}}ff
dim_focused_color=0x00000000
dim_unfocused_color=0x{{colors.scrim.default.hex_stripped}}55
