# GENERIERT von matugen – nicht von Hand bearbeiten!
# Quelle: ~/dotfiles/theme/templates/kitty-ansi.conf
# Überschreibt die feste Palette aus ansi.conf

# ===== Graustufen aus dem Theme =====
color0  {{colors.surface_container_high.default.hex}}
color8  {{colors.outline.default.hex}}
color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}

# ===== Farben: kräftige Vorgabe, Farbton leicht ans Theme angepasst =====
# normal = harmonisiert, hell = harmonisiert + aufgehellt
color1  {{ colors.red_source.default.hex | harmonize: {{ colors.source_color.default.hex }} }}
color9  {{ colors.red_source.default.hex | harmonize: {{ colors.source_color.default.hex }} | lighten: 12.0 }}

color2  {{ colors.green_source.default.hex | harmonize: {{ colors.source_color.default.hex }} }}
color10 {{ colors.green_source.default.hex | harmonize: {{ colors.source_color.default.hex }} | lighten: 12.0 }}

color3  {{ colors.yellow_source.default.hex | harmonize: {{ colors.source_color.default.hex }} }}
color11 {{ colors.yellow_source.default.hex | harmonize: {{ colors.source_color.default.hex }} | lighten: 12.0 }}

color4  {{ colors.blue_source.default.hex | harmonize: {{ colors.source_color.default.hex }} }}
color12 {{ colors.blue_source.default.hex | harmonize: {{ colors.source_color.default.hex }} | lighten: 12.0 }}

color5  {{ colors.magenta_source.default.hex | harmonize: {{ colors.source_color.default.hex }} }}
color13 {{ colors.magenta_source.default.hex | harmonize: {{ colors.source_color.default.hex }} | lighten: 12.0 }}

color6  {{ colors.cyan_source.default.hex | harmonize: {{ colors.source_color.default.hex }} }}
color14 {{ colors.cyan_source.default.hex | harmonize: {{ colors.source_color.default.hex }} | lighten: 12.0 }}
