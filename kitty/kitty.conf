# ~/.config/kitty/kitty.conf  (Original: ~/dotfiles/kitty/kitty.conf)
# Alle Optionen: https://sw.kovidgoyal.net/kitty/conf/

# ===== Schrift =====
include fonts.conf
bold_font        auto
italic_font      auto
bold_italic_font auto

# ===== Verhalten =====
shell             /usr/bin/zsh
cursor_shape      beam
enable_audio_bell no

# ===== Fenster =====
background_opacity 0.55

# ===== Theme =====
# feste Terminalpalette (dotfiles/theme/ansi.conf)
include ansi.conf
include ansi-matugen.conf
# Grundfarben (generiert von matugen)
include colors.conf
