// LibreWolf-Einstellungen für alle Profile (Original: ~/dotfiles/librewolf/)
// Läuft mit vollen Rechten, siehe dotfiles.js

// ===== Einstellungen =====
// Für diese Sprachen nie eine Übersetzung anbieten
defaultPref("browser.translations.neverTranslateLanguages", "de,en,sv");
defaultPref("devtools.chrome.enabled", true);
defaultPref("browser.toolbars.bookmarks.visibility", "always");

// ===== Adressleiste =====
defaultPref("browser.urlbar.suggest.history", false);        // keine Einträge aus der Chronik
defaultPref("browser.urlbar.suggest.recentsearches", false); // keine letzten Suchanfragen

// ===== Tabs und Fenster =====
defaultPref("sidebar.revamp", true);                         // neue Seitenleiste (Voraussetzung)
defaultPref("sidebar.verticalTabs", true);                   // vertikale Tabs
defaultPref("sidebar.backupState", '{"launcherExpanded":false,"launcherVisible":true}'); // Seitenleiste eingeklappt
defaultPref("middlemouse.paste", false);                     // kein Einfügen per Mittelklick

// ===== Schriften (westliche Schriftsysteme) =====
defaultPref("font.name.serif.x-western",      "Adwaita Mono");
defaultPref("font.name.sans-serif.x-western", "Adwaita Sans");


// ===== Live-Stylesheets =====
// Lädt Farben (matugen) und Form (ui.css) und tauscht sie bei Änderung aus.
try {
  (function () {
    const Cc = Components.classes;
    const Ci = Components.interfaces;
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"]
                  .getService(Ci.nsIStyleSheetService);
    const home = Services.dirsvc.get("Home", Ci.nsIFile).path;

    const sheets = [
      home + "/.local/state/theme/librewolf.css",   // Farben, von matugen erzeugt
      home + "/dotfiles/librewolf/ui.css",          // Form und Layout
    ].map(path => ({ path: path, uri: null, mtime: 0 }));

    function refresh() {
      for (const s of sheets) {
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath(s.path);
        if (!f.exists())
          continue;

        const mtime = f.lastModifiedTime;
        if (mtime === s.mtime)
          continue;                       // unverändert
        s.mtime = mtime;

        if (s.uri && sss.sheetRegistered(s.uri, sss.USER_SHEET))
          sss.unregisterSheet(s.uri, sss.USER_SHEET);

        // Zeitstempel in der URL, damit nicht die alte Fassung aus dem Cache kommt
        s.uri = Services.io.newURI(Services.io.newFileURI(f).spec + "?v=" + mtime);
        sss.loadAndRegisterSheet(s.uri, sss.USER_SHEET);
      }
    }

    refresh();

    const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback({ notify: refresh }, 1000, Ci.nsITimer.TYPE_REPEATING_SLACK);
    // Referenz behalten, sonst würde der Timer vom Garbage Collector entfernt
    globalThis.__dotfilesStyleTimer = timer;
  })();
} catch (e) {
  Services.console.logStringMessage("dotfiles: " + e);
}

// ===== Strg+Q schließt den aktuellen Tab (wie Strg+W) statt den Browser =====
try {
  Services.obs.addObserver(win => {
    const key = win.document.getElementById("key_quitApplication");
    if (!key)
      return;
    key.removeAttribute("oncommand");
    key.setAttribute("command", "cmd_close");
  }, "browser-delayed-startup-finished");
} catch (e) {
  Services.console.logStringMessage("dotfiles: " + e);
}
