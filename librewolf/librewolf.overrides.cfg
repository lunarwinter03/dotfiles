// LibreWolf-Einstellungen für alle Profile (Original: ~/dotfiles/librewolf/)
// Läuft mit vollen Rechten, siehe dotfiles.js

// ===== Einstellungen =====
// Für diese Sprachen nie eine Übersetzung anbieten
defaultPref("browser.translations.neverTranslateLanguages", "de,en,sv");
defaultPref("devtools.chrome.enabled", true);
defaultPref("browser.toolbars.bookmarks.visibility", "always");

// ===== Adressleiste =====
defaultPref("browser.urlbar.suggest.history", false);        // keine Einträge aus der Chronik
defaultPref("browser.urlbar.suggest.recentsearches", false); // keine letzten Suchanfragen

// ===== Tabs und Fenster =====
defaultPref("sidebar.revamp", true);                         // neue Seitenleiste (Voraussetzung)
defaultPref("sidebar.verticalTabs", true);                   // vertikale Tabs
defaultPref("sidebar.backupState", '{"launcherExpanded":false,"launcherVisible":true}'); // Seitenleiste eingeklappt
defaultPref("middlemouse.paste", false);                     // kein Einfügen per Mittelklick
// ===== Schriften (westliche Schriftsysteme) =====
defaultPref("font.name.serif.x-western",      "Adwaita Mono");
defaultPref("font.name.sans-serif.x-western", "Adwaita Sans");


// ===== Live-Stylesheets =====
// Lädt Farben (matugen) und Form (ui.css) und tauscht sie bei Änderung aus.
try {
  (function () {
    const Cc = Components.classes;
    const Ci = Components.interfaces;
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"]
                  .getService(Ci.nsIStyleSheetService);
    const home = Services.dirsvc.get("Home", Ci.nsIFile).path;

    const sheets = [
      home + "/.local/state/theme/librewolf.css",   // Farben, von matugen erzeugt
      home + "/dotfiles/librewolf/ui.css",          // Form und Layout
    ].map(path => ({ path: path, uri: null, mtime: 0 }));

    function refresh() {
      for (const s of sheets) {
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath(s.path);
        if (!f.exists())
          continue;

        const mtime = f.lastModifiedTime;
        if (mtime === s.mtime)
          continue;                       // unverändert
        s.mtime = mtime;

        if (s.uri && sss.sheetRegistered(s.uri, sss.USER_SHEET))
          sss.unregisterSheet(s.uri, sss.USER_SHEET);

        // Zeitstempel in der URL, damit nicht die alte Fassung aus dem Cache kommt
        s.uri = Services.io.newURI(Services.io.newFileURI(f).spec + "?v=" + mtime);
        sss.loadAndRegisterSheet(s.uri, sss.USER_SHEET);
      }
    }

    refresh();

    const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback({ notify: refresh }, 1000, Ci.nsITimer.TYPE_REPEATING_SLACK);
    // Referenz behalten, sonst würde der Timer vom Garbage Collector entfernt
    globalThis.__dotfilesStyleTimer = timer;
  })();
} catch (e) {
  Services.console.logStringMessage("dotfiles: " + e);
}

// ===== Strg+Q schließt den aktuellen Tab (wie Strg+W) statt den Browser =====
try {
  Services.obs.addObserver(win => {
    const key = win.document.getElementById("key_quitApplication");
    if (!key)
      return;
    key.removeAttribute("oncommand");
    key.setAttribute("command", "cmd_close");
  }, "browser-delayed-startup-finished");
} catch (e) {
  Services.console.logStringMessage("dotfiles: " + e);
}

// ===== Add-ons: werden beim Start installiert, falls sie fehlen =====
// Neues Add-on: eine Zeile ergänzen. Die ID steht in about:support unter "Erweiterungen".
//   pin: true  → Symbol nach der Installation in die Symbolleiste (nur einmal,
//                danach frei änderbar)
const DOTFILES_ADDONS = [
  { id: "addon@darkreader.org", pin: true },   // Dark Reader
];

// Protokoll: Konsole und about:config (dotfiles.log), damit es sicher sichtbar ist
function dotfilesLog(msg) {
  try {
    Services.console.logStringMessage("dotfiles: " + msg);
    const old = Services.prefs.getStringPref("dotfiles.log", "");
    Services.prefs.setStringPref("dotfiles.log", (old ? old + " | " : "") + msg);
  } catch (e) {}
}
// Bei jedem Start neu beginnen
try { Services.prefs.clearUserPref("dotfiles.log"); } catch (e) {}

// Symbol in die Navigationsleiste, sobald das Add-on es angelegt hat
function dotfilesPinWhenReady(CustomizableUI, addonId) {
  // So bildet Firefox aus der Add-on-ID den Namen des Symbols
  const widgetId = addonId.toLowerCase().replace(/[^a-z0-9_-]/g, "_") + "-browser-action";
  const listener = {
    onWidgetCreated(createdId) {
      if (createdId !== widgetId)
        return;
      CustomizableUI.removeListener(listener);
      CustomizableUI.addWidgetToArea(widgetId, CustomizableUI.AREA_NAVBAR);
    },
  };
  CustomizableUI.addListener(listener);
}

// Alle offenen Tabs aller Browserfenster, jeweils mit ihrem Fenster
function dotfilesAllTabs() {
  const entries = [];
  for (const win of Services.wm.getEnumerator("navigator:browser"))
    for (const tab of win.gBrowser.tabs)
      entries.push({ win, tab });
  return entries;
}

// Begrüßungs-Tabs eines frisch installierten Add-ons schließen
function dotfilesCloseWelcomeTabs(win, addon, tabsBefore, winsBefore) {
  const policy = win.WebExtensionPolicy.getByID(addon.id);
  const extHost = policy ? policy.mozExtensionHostname : null;
  let siteHost = null;
  try {
    if (addon.homepageURL)
      siteHost = Services.io.newURI(addon.homepageURL).host;
  } catch (e) {}
  dotfilesLog("suche Begrüßungs-Tabs: intern=" + extHost + ", Seite=" + siteHost);

  const seen = new Set();
  let rounds = 0;
  const check = () => {
    try {
      for (const { win: tabWin, tab } of dotfilesAllTabs()) {
        if (tabsBefore.has(tab))
          continue;                             // war schon vorher offen
        let host = "";
        try { host = tab.linkedBrowser.currentURI.host; } catch (e) {}
        if (host && !seen.has(tab)) {
          seen.add(tab);
          dotfilesLog("neuer Tab: " + host);
        }
        const isWelcome = (extHost && host === extHost)
          || (siteHost && (host === siteHost || host.endsWith("." + siteHost)));
        if (!isWelcome)
          continue;

	if (tabWin.gBrowser.tabs.length > 1) {
          tabWin.gBrowser.removeTab(tab);
          dotfilesLog("Tab geschlossen: " + host);
        } else if (!winsBefore.has(tabWin)) {
          tabWin.close();                       // neues Fenster nur mit diesem Tab
          dotfilesLog("Fenster geschlossen: " + host);
        } else {
          dotfilesLog("letzter Tab in bestehendem Fenster, bleibt: " + host);
        }
      }
    } catch (e) {
      dotfilesLog("Fehler beim Schließen: " + e);
    }
    if (++rounds < 20)
      win.setTimeout(check, 500);               // 20 × 0,5 s = 10 Sekunden
  };
  check();
}


try {
  let addonsChecked = false;
  Services.obs.addObserver(async win => {
    if (addonsChecked)
      return;                                   // nur beim ersten Fenster prüfen
    addonsChecked = true;
    dotfilesLog("Add-on-Prüfung gestartet");
    try {
      // Beide sind in jedem Browserfenster schon vorhanden
      const AddonManager = win.AddonManager;
      const CustomizableUI = win.CustomizableUI;
      if (!AddonManager || !CustomizableUI) {
        dotfilesLog("AddonManager oder CustomizableUI fehlt im Fenster");
        return;
      }

      for (const entry of DOTFILES_ADDONS) {
        if (await AddonManager.getAddonByID(entry.id)) {
          dotfilesLog("vorhanden: " + entry.id);
          continue;
        }
        dotfilesLog("installiere: " + entry.id);

        if (entry.pin)
          dotfilesPinWhenReady(CustomizableUI, entry.id);

	const winsBefore = new Set(Services.wm.getEnumerator("navigator:browser"));
        const tabsBefore = new Set(dotfilesAllTabs().map(e => e.tab));
        const url = "https://addons.mozilla.org/firefox/downloads/latest/" + entry.id + "/latest.xpi";
        const install = await AddonManager.getInstallForURL(url);
        await install.install();

        if (install.addon)
          dotfilesCloseWelcomeTabs(win, install.addon, tabsBefore, winsBefore);
	dotfilesLog("installiert: " + entry.id);
      }
    } catch (e) {
      dotfilesLog("Fehler: " + e);
    }
  }, "browser-delayed-startup-finished");
} catch (e) {
  dotfilesLog("Fehler beim Einrichten: " + e);
}
