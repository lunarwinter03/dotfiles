# Monitors: DP-1 is the main screen (left, 144 Hz).
# All y offsets shifted by 150, mango does not allow negative positions.
monitor_rule=name:DP-1,width:1920,height:1080,refresh:143.981,x:0,y:150,scale:1,vrr:0,rr:0
monitor_rule=name:DP-2,width:1680,height:1050,refresh:59.954,x:1920,y:0,scale:1,vrr:0,rr:0
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:59.939,x:3600,y:250,scale:1,vrr:0,rr:0

mouse_accel_profile=1
mouse_accel_speed=-0.5

# Focus the main screen before anything starts
exec_once=mmsg dispatch focusmon,DP-1
